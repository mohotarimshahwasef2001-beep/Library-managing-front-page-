
<!DOCTYPE html>
<html>
<head>
    <title>Library Membership Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Library Membership Form</h1>

    <form id="Membership">

        <label>Name:</label>
        <input type="text" id="Name" >
        <br><br>

        <label>Age:</label>
        <input type="number" id="Age" >
        <br><br>

        <label>Email:</label>
        <input type="email" id="Email" >
        <br><br>

        <label>Phone:</label>
        <input type="tel" id="Phone" >
        <br><br>

        <label>Membership:</label>

        <input type="radio" name="Membership" value="Basic" checked>
        Basic

        <input type="radio" name="Membership" value="Silver">
        Silver

        <input type="radio" name="Membership" value="Gold">
        Gold

        <br><br>

        <input type="submit" value="Register">

    </form>

    <div id="output"></div>

    <script src="script.js"></script>

</body>
</html>
